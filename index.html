// Theme: applied before the first paint so the page does not flash. Exposed as EVM.theme for the page code.
(function () {
  var BAR = { light: "#cfe3f7", dark: "#0b1220" }; // colour of the browser bar on mobile, same as the page background of each theme
  function apply(t) {
    document.documentElement.setAttribute("data-theme", t);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", BAR[t]);
  }
  var t = null;
  try { t = localStorage.getItem("theme"); } catch (e) {}
  if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  apply(t);
  window.EVM = window.EVM || {};
  window.EVM.theme = {
    get: function () { return document.documentElement.getAttribute("data-theme"); },
    set: function (next) { apply(next); try { localStorage.setItem("theme", next); } catch (e) {} },
  };
})();
</script>
