<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>🇬🇧 English Visual Maps</title>

<script>
(function(){var t=null;try{t=localStorage.getItem("theme")}catch(e){}
if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
document.documentElement.setAttribute("data-theme",t);})();
</script>
<style>
  :root { --hand:"Chalkboard SE","Marker Felt","Bradley Hand","Segoe Print","Comic Sans MS",cursive; --navy:#1e3a8a; --ink:#1e293b; }
  * { box-sizing:border-box; }
  body { margin:0; background:linear-gradient(135deg,#cfe3f7,#e9dff5); font-family:"Avenir Next","Segoe UI",system-ui,sans-serif; color:var(--ink); padding:20px; min-height:100vh; }
  header { max-width:1240px; margin:0 auto 18px; text-align:center; }
  header h1 { margin:0 0 4px; color:var(--navy); font-family:var(--hand); font-size:34px; }
  header p { margin:0 0 12px; color:#475569; font-size:14px; }
  .tabs, .chips, .filters { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:10px; align-items:center; font-size:13px; }
  .tabs button, .tabs-btn { border:none; background:#fff; border-radius:999px; padding:8px 16px; font-size:14px; cursor:pointer; color:#334155; box-shadow:0 2px 4px #0003; font-family:inherit; }
  .tabs button.on { background:var(--navy); color:#fff; }
  .chips a { background:#fff; border-radius:8px; padding:4px 10px; font-size:12.5px; text-decoration:none; color:#334155; box-shadow:0 1px 2px #0003; }
  .chips a:hover { background:#fde68a; }
  .filters select { padding:6px 10px; border-radius:8px; border:1px solid #94a3b8; font-family:inherit; }
  #q { width:min(420px,90%); padding:8px 14px; border-radius:999px; border:1px solid #94a3b8; font-size:14px; margin-bottom:12px; font-family:inherit; }
  .idx summary { cursor:pointer; font-size:13px; color:#1e3a8a; font-weight:600; margin-bottom:8px; }
  .count { font-size:13px; color:#64748b; margin-bottom:8px; }

  /* ---------- page (notebook sheet) ---------- */
  .page { position:relative; max-width:1240px; margin:0 auto 34px; background:#fffef9; border-radius:16px; padding:92px 30px 28px; scroll-margin-top:10px;
          box-shadow:0 10px 28px #0004, 0 0 0 1px #0001;
          background-image:linear-gradient(#bcd4ee55 1px,transparent 1px),linear-gradient(90deg,#bcd4ee55 1px,transparent 1px); background-size:26px 26px; }
  .rings { position:absolute; top:8px; left:56px; right:56px; height:26px; background:
          radial-gradient(ellipse 5px 9px at 50% 50%,#334155 0 55%,transparent 60%) 0 0/22px 26px repeat-x; filter:drop-shadow(0 2px 1px #0004); z-index:4; }
  .rings::after { content:""; position:absolute; inset:0; background:radial-gradient(circle at 50% 50%,#fff 0 3px,transparent 4px) 0 0/22px 26px repeat-x; opacity:.0; }
  .tape { position:absolute; width:76px; height:26px; background:#fcd34d99; z-index:4; box-shadow:0 1px 2px #0002; }
  .tape.l { left:-18px; top:8px; transform:rotate(-45deg); background:#93c5fd99; }
  .tape.r { right:-18px; top:8px; transform:rotate(45deg); background:#fda4af99; }
  .star { position:absolute; font-size:22px; opacity:.55; z-index:1; pointer-events:none; }
  .topbar { display:contents; }
  .level { position:absolute; top:50px; right:34px; border:3px solid #2563eb; color:#2563eb; border-radius:50%; width:52px; height:52px; display:grid; place-items:center; font-weight:800; font-size:16px; font-family:var(--hand); background:#fff; z-index:5; box-shadow:0 0 0 3px #fff,0 0 0 5px #93c5fd; }
  .tag { position:absolute; top:52px; left:30px; font-size:12px; color:#64748b; z-index:5; background:#fff9; padding:2px 8px; border-radius:999px; }

  .grid { display:grid; grid-template-columns:1fr 370px 1fr; gap:22px 76px; align-items:stretch; position:relative; z-index:2; }
  .col { display:flex; flex-direction:column; gap:20px; }
  .mid { display:flex; flex-direction:column; justify-content:center; gap:26px; }

  /* sticker look for emoji pictures */
  .stk { display:inline-block; line-height:1; filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 4px 4px #0005); }

  /* ---------- central cloud ---------- */
  .cloudwrap { position:relative; padding:34px 30px; text-align:center; }
  .cloudwrap svg.cl { position:absolute; left:0; top:0; width:100%; height:100%; z-index:0; overflow:visible; }
  .cloudin { position:relative; z-index:1; }
  .scene { display:flex; justify-content:center; align-items:flex-end; margin-bottom:6px; }
  .scene .stk { margin:0 -4px; }
  .cloudin h1 { margin:0; font-family:var(--hand); font-size:27px; letter-spacing:.5px; text-transform:uppercase; color:var(--navy); line-height:1.05; }
  .cloudin h2 { margin:6px 0 8px; font-family:var(--hand); font-size:17px; color:#c2410c; text-transform:uppercase; }
  .cloudin p { margin:0; font-size:12.5px; color:#475569; }

  /* ---------- boxes ---------- */
  .box { position:relative; background:#fff; border:3px solid var(--c); border-radius:18px; overflow:visible; box-shadow:3px 4px 0 color-mix(in srgb,var(--c) 35%,transparent); }
  .box .hd { display:flex; align-items:center; gap:10px; background:var(--c); color:#fff; padding:7px 12px 7px 40px; border-radius:13px 13px 0 0; position:relative; min-height:50px; }
  .box .num { position:absolute; left:-14px; top:-14px; width:34px; height:34px; border-radius:50%; background:#fff; color:var(--c); border:3px solid var(--c); display:grid; place-items:center; font-weight:900; font-family:var(--hand); font-size:17px; }
  .box .hd h3 { margin:0; font-family:var(--hand); font-size:15px; text-transform:uppercase; line-height:1.1; }
  .box .hd small { display:block; font-family:"Avenir Next","Segoe UI",sans-serif; font-weight:500; text-transform:none; font-size:12px; opacity:.92; }
  .box .bd { display:flex; gap:10px; padding:10px 12px 6px; }
  .pic { flex:0 0 96px; height:92px; position:relative; border-radius:46% 54% 52% 48% / 55% 45% 55% 45%; background:color-mix(in srgb,var(--c) 16%,white); }
  .pic .stk { position:absolute; }
  .box ul { list-style:none; padding:0; margin:0; font-size:13px; flex:1; min-width:0; }
  .box li { padding:3px 0; border-bottom:1px dashed color-mix(in srgb,var(--c) 30%,white); }
  .box li:last-child { border-bottom:none; }
  .box li b { color:#0f172a; } .box li i { color:#64748b; font-style:normal; display:block; font-size:12.5px; }
  .speak { display:flex; align-items:flex-end; gap:8px; padding:4px 12px 10px; }
  .bubble { position:relative; flex:1; background:color-mix(in srgb,var(--c) 9%,white); border:2px solid var(--c); border-radius:14px; padding:6px 10px; font-size:12.5px; }
  .bubble::after { content:""; position:absolute; right:-9px; bottom:12px; width:14px; height:14px; background:color-mix(in srgb,var(--c) 9%,white); border-right:2px solid var(--c); border-top:2px solid var(--c); transform:rotate(45deg); }
  .bubble b { font-weight:600; } .bubble span { display:block; color:#64748b; font-size:12px; }
  .mascot { font-size:40px; }

  /* ---------- exercise ---------- */
  .exercise { position:relative; background:#fff; border:3px dashed #64748b; border-radius:16px; padding:14px 16px 10px; font-size:14px; }
  .exercise h4 { position:absolute; top:-14px; left:16px; margin:0; background:#475569; color:#fff; padding:3px 14px; border-radius:999px; font-family:var(--hand); font-size:14px; text-transform:uppercase; }
  .exercise .think { position:absolute; right:10px; top:-30px; font-size:38px; }
  .exercise .q { font-size:14px; margin-top:6px; }
  .exercise details { margin-top:3px; } .exercise summary { cursor:pointer; color:#2563eb; font-weight:600; font-size:12.5px; }
  .exercise .ans { margin-top:3px; background:#dcfce7; border-radius:8px; padding:4px 8px; font-size:13px; }

  .level.lv-A1,.level.lv-A2 { border-color:#16a34a; color:#16a34a; box-shadow:0 0 0 3px #fff,0 0 0 5px #86efac; }
  .level.lv-C1,.level.lv-C2 { border-color:#9333ea; color:#9333ea; box-shadow:0 0 0 3px #fff,0 0 0 5px #d8b4fe; }
  svg.arrows { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:1; overflow:visible; }
  /* ---------- theme toggle + dark mode ---------- */
  #theme { position:absolute; top:0; right:0; border:none; background:#fff; border-radius:999px; width:40px; height:40px; font-size:20px; cursor:pointer; box-shadow:0 2px 4px #0003; }
  header { position:relative; }
  html[data-theme="dark"] { color-scheme:dark; }
  html[data-theme="dark"] body { background:linear-gradient(135deg,#0b1220,#1a1530); color:#e2e8f0; }
  html[data-theme="dark"] header h1 { color:#bfdbfe; }
  html[data-theme="dark"] header p, html[data-theme="dark"] .count { color:#94a3b8; }
  html[data-theme="dark"] .idx summary { color:#93c5fd; }
  html[data-theme="dark"] #theme, html[data-theme="dark"] .tabs button, html[data-theme="dark"] .chips a { background:#1e293b; color:#e2e8f0; box-shadow:0 2px 4px #0008; }
  html[data-theme="dark"] .tabs button.on { background:#3b82f6; color:#fff; }
  html[data-theme="dark"] .chips a:hover { background:#854d0e; }
  html[data-theme="dark"] .filters select, html[data-theme="dark"] #q { background:#1e293b; color:#e2e8f0; border-color:#475569; }
  html[data-theme="dark"] .page { background-color:#161e2e; box-shadow:0 10px 28px #0009, 0 0 0 1px #fff1;
          background-image:linear-gradient(#60a5fa14 1px,transparent 1px),linear-gradient(90deg,#60a5fa14 1px,transparent 1px); }
  html[data-theme="dark"] .rings { filter:drop-shadow(0 2px 1px #000a); }
  html[data-theme="dark"] .tag { background:#0f172acc; color:#94a3b8; }
  html[data-theme="dark"] .level { background:#0f172a; box-shadow:0 0 0 3px #161e2e,0 0 0 5px #3b82f6; color:#93c5fd; border-color:#60a5fa; }
  html[data-theme="dark"] .level.lv-A1, html[data-theme="dark"] .level.lv-A2 { color:#4ade80; border-color:#4ade80; box-shadow:0 0 0 3px #161e2e,0 0 0 5px #16a34a; }
  html[data-theme="dark"] .level.lv-C1, html[data-theme="dark"] .level.lv-C2 { color:#d8b4fe; border-color:#c084fc; box-shadow:0 0 0 3px #161e2e,0 0 0 5px #9333ea; }
  html[data-theme="dark"] .cloudwrap svg.cl path:first-child { fill:#0f172a; stroke:#60a5fa; }
  html[data-theme="dark"] .cloudwrap svg.cl path:nth-child(2) { stroke:#3b82f6; }
  html[data-theme="dark"] .cloudin h1 { color:#bfdbfe; }
  html[data-theme="dark"] .cloudin h2 { color:#fdba74; }
  html[data-theme="dark"] .cloudin p { color:#94a3b8; }
  html[data-theme="dark"] .box { background:#0f172a; box-shadow:3px 4px 0 color-mix(in srgb,var(--c) 30%,transparent); }
  html[data-theme="dark"] .box .num { background:#0f172a; }
  html[data-theme="dark"] .pic { background:color-mix(in srgb,var(--c) 30%,#0f172a); }
  html[data-theme="dark"] .stk { filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 4px 4px #0008); }
  html[data-theme="dark"] .box li { border-bottom-color:color-mix(in srgb,var(--c) 40%,#0f172a); }
  html[data-theme="dark"] .box li b { color:#f1f5f9; }
  html[data-theme="dark"] .box li i, html[data-theme="dark"] .bubble span { color:#94a3b8; }
  html[data-theme="dark"] .bubble { background:color-mix(in srgb,var(--c) 18%,#0f172a); }
  html[data-theme="dark"] .bubble::after { background:color-mix(in srgb,var(--c) 18%,#0f172a); }
  html[data-theme="dark"] .exercise { background:#0f172a; border-color:#64748b; }
  html[data-theme="dark"] .exercise summary { color:#93c5fd; }
  html[data-theme="dark"] .exercise .ans { background:#14532d; color:#dcfce7; }
  @media (max-width:1000px){ .grid{grid-template-columns:1fr;} svg.arrows{display:none;} .tape{display:none} }

  /* ---------- filter bar ---------- */
  header { margin-bottom:0; }
  #bar { max-width:1240px; margin:0 auto; display:flex; flex-direction:column; text-align:center; }
  #bar #q { align-self:center; }
  .hdr2 { max-width:1240px; margin:0 auto 18px; text-align:center; }
  .seg { display:flex; align-self:center; width:min(420px,100%); margin-bottom:10px; background:#fff; border-radius:10px; padding:3px; box-shadow:0 1px 2px #0002; }
  .count { margin-bottom:8px; }
  .seg button { flex:1; border:none; background:none; padding:7px 0; font-size:13px; font-family:inherit; border-radius:8px; color:#475569; cursor:pointer; }
  .seg button.on { background:var(--navy); color:#fff; font-weight:600; }
  html[data-theme="dark"] .seg { background:#1e293b; }
  html[data-theme="dark"] .seg button { color:#cbd5e1; }
  html[data-theme="dark"] .seg button.on { background:#3b82f6; color:#fff; }
  html[data-theme="dark"] #bar { background-color:transparent; }
  @media (max-width:1000px){
    .box .hd { cursor:pointer; padding-right:36px; -webkit-tap-highlight-color:transparent; }
    .box .hd::after { content:"▸"; position:absolute; right:14px; top:50%; transform:translateY(-50%); font-size:16px; transition:transform .15s; }
    .box.open .hd::after { transform:translateY(-50%) rotate(90deg); }
    .box:not(.open) .hd { border-radius:13px; }
    .box:not(.open) .bd, .box:not(.open) .speak { display:none; }
    .grid { gap:14px; }
    .col, .mid { display:contents; }
    .cloudwrap { order:-1; }
    .exercise { order:1; margin-top:34px; }
  }
  @media (max-width:700px){
    .star { display:none; }
    body { padding:0 12px 20px; }
    header { padding-top:12px; }
    header h1 { font-size:19px; margin:0 0 8px; padding:0 40px; text-align:center; }
    header p { display:none; }
    #theme { top:8px; width:34px; height:34px; font-size:16px; }
    #bar { position:sticky; top:0; z-index:30; margin:0 -12px; padding:6px 12px 8px; background:#e4ecf8f2; backdrop-filter:blur(6px); box-shadow:0 2px 6px #0002; }
    html[data-theme="dark"] #bar { background:#0f172af2; box-shadow:0 2px 6px #0008; }
    #bar #q { order:1; align-self:stretch; width:100%; margin-bottom:8px; padding:10px 14px; }
    #bar .tabs { order:2; flex-wrap:nowrap; overflow-x:auto; justify-content:flex-start; margin:0 -12px 8px; padding:0 12px 2px; scrollbar-width:none; }
    #bar .tabs::-webkit-scrollbar { display:none; }
    #bar .tabs button { flex:none; padding:7px 13px; font-size:13px; white-space:nowrap; }
    #bar .tabs button small { display:none; }
    .seg { order:3; width:100%; margin-bottom:0; }
    .count { padding:2px 4px; }
    .hdr2 { margin-bottom:12px; }
    .idx summary { text-align:left; padding-left:4px; }
    .page { scroll-margin-top:130px; padding:44px 20px 24px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:28px; position:relative; z-index:5; }
    .topbar .tag, .topbar .level { position:static; }
    .topbar .tag { flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .topbar .level { flex:none; width:2.75rem; height:2.75rem; font-size:.95rem; margin-right:5px; }
  }
  #up { position:fixed; right:16px; bottom:max(18px,env(safe-area-inset-bottom)); width:46px; height:46px; border:none; border-radius:50%; background:var(--navy); color:#fff; font-size:20px; cursor:pointer; display:grid; place-items:center; box-shadow:0 4px 10px #0005; z-index:40; opacity:0; visibility:hidden; transform:translateY(10px); transition:opacity .2s,transform .2s,visibility .2s; -webkit-tap-highlight-color:transparent; }
  #up.show { opacity:1; visibility:visible; transform:none; }
  html[data-theme="dark"] #up { background:#3b82f6; }
  @media print { #up{display:none} #theme{display:none} html[data-theme="dark"] body{background:#fff} body{background:#fff;padding:0} header{display:none} .page{break-after:page;box-shadow:none;margin:0 auto} }
</style>
</head>
<body>
<button id="up" type="button" aria-label="Volver arriba" title="Volver arriba">⬆️</button>
<header>
  <button id="theme" type="button" aria-label="Cambiar modo claro/oscuro" title="Modo claro / oscuro"></button>
  <h1>🇬🇧 English · Visual Maps</h1>
  <p>Mapas visuales de inglés británico. Elige una categoría o busca un tema.</p>
</header>
<div id="bar">
  <div class="tabs" id="tabs"></div>

</div>

  <div class="count" id="count"></div>
  <details class="idx"><summary>📑 Índice de temas</summary><div class="chips" id="chips"></div></details>
</div>
<div id="maps"></div>

<script>
(function(){
  const b = document.getElementById("theme"), root = document.documentElement;
  const sync = () => { b.textContent = root.getAttribute("data-theme")==="dark" ? "☀️" : "🌙"; };
  b.addEventListener("click", () => {
    const next = root.getAttribute("data-theme")==="dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch(e) {}
    sync();
  });
  sync();
})();
const C = ["#2563eb","#dc2626","#059669","#d97706","#7c3aed","#db2777"];
const MASCOTS = ["🧑‍🏫","💁‍♀️","🧔","👩‍🎓","🧑‍💼","🙋‍♂️"];
const ART = window.ART || {};
const LVL_ORDER = ["A1","A2","B1","B2","C1","C2"];
const CAT_ORDER = [...new Set((window.MAPS || []).map(m=>m.cat))];
const ALL = (window.MAPS || []).map((m,i)=>({...m, o:i}))
  .sort((a,b)=> LVL_ORDER.indexOf(a.lvl)-LVL_ORDER.indexOf(b.lvl) || CAT_ORDER.indexOf(a.cat)-CAT_ORDER.indexOf(b.cat) || a.o-b.o)
  .map((m,i)=>({...m, id:i}));
const cats = [...new Set(ALL.map(m=>m.cat))];
let curCat = "All", query = "", curLvl = "";
const SHORT = {"Grammar: Tenses & Verbs":"Tenses","Grammar: Structures":"Structures","Phrasal Verbs, Idioms & Collocations":"Phrasal & Idioms","Vocabulary: Everyday Life":"Everyday","Vocabulary: Work, Study & Society":"Work & Study","Communication & British Culture":"Culture"};
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

function renderTabs(){
  const t = document.getElementById("tabs");
  t.innerHTML = ["All",...cats].map(c=>`<button class="${c===curCat?"on":""}" data-c="${esc(c)}">${c==="All"?"📚 All":esc(SHORT[c]||c)} <small>(${c==="All"?ALL.length:ALL.filter(m=>m.cat===c).length})</small></button>`).join("");
  t.querySelectorAll("button").forEach(b=>b.onclick=()=>{curCat=b.dataset.c; render();});
}

function renderSeg(){
  const s = document.getElementById("seg");
  s.innerHTML = ["","A1","A2","B1","B2","C1","C2"].map(l=>`<button data-l="${l}" class="${curLvl===l?"on":""}">${l||"Todos"}</button>`).join("");
  s.querySelectorAll("button").forEach(b=>b.onclick=()=>{curLvl=b.dataset.l; render();});
}

// positions for 2 or 3 stickers inside the picture blob: [left, top, size, rotation]
const SLOTS = {
  1:[[22,16,52,-6]],
  2:[[4,30,50,-8],[44,2,44,8]],
  3:[[2,36,40,-8],[46,34,40,7],[22,2,46,-3]]
};
function pic(emojis){
  const s = SLOTS[Math.min(emojis.length,3)];
  return `<div class="pic">${emojis.slice(0,3).map((e,k)=>`<span class="stk" style="left:${s[k][0]}px;top:${s[k][1]}px;font-size:${s[k][2]}px;transform:rotate(${s[k][3]}deg)">${e}</span>`).join("")}</div>`;
}

function mapHTML(m){
  const art = ART[m.t] || {};
  const mascot = art.mascot || MASCOTS[m.id % MASCOTS.length];
  const scene = art.scene || [m.icon];
  const box = (b,j)=>`<div class="box${j===0?" open":""}" id="b${m.id}_${j}" style="--c:${C[j%6]}">
    <div class="hd"><div class="num">${j+1}</div><div><h3>${esc(b.h)}</h3></div></div>
    <div class="bd">${pic((art.boxes && art.boxes[j]) || [b.e])}
      <ul>${b.i.map(([a,c])=>`<li><b>${esc(a)}</b><i>${esc(c)}</i></li>`).join("")}</ul></div>
    <div class="speak"><div class="bubble"><b>${esc(b.ex[0])}</b><span>${esc(b.ex[1])}</span></div><span class="stk mascot">${mascot}</span></div></div>`;
  const star = (x,y,e)=>`<span class="star" style="left:${x};top:${y}">${e}</span>`;
  return `<section class="page" id="m${m.id}" data-id="${m.id}">
    <div class="rings"></div><div class="tape l"></div><div class="tape r"></div>
    ${star("2%","46%","✨")}${star("97%","52%","⭐")}${star("48%","98%","✨")}
    <div class="topbar"><div class="tag">#${m.id+1} · ${esc(m.cat)} · ${esc(m.type)}</div><div class="level lv-${m.lvl}">${m.lvl}</div></div>
    <svg class="arrows"></svg>
    <div class="grid">
      <div class="col">${m.boxes.slice(0,3).map((b,j)=>box(b,j)).join("")}</div>
      <div class="mid">
        <div class="cloudwrap" id="c${m.id}"><svg class="cl"></svg>
          <div class="cloudin">
            <div class="scene">${scene.map((e,k)=>`<span class="stk" style="font-size:${k%2?40:50}px;transform:rotate(${(k-2)*5}deg)">${e}</span>`).join("")}</div>
            <h1>${esc(m.t)}</h1><h2>${esc(m.es)}</h2><p>${esc(m.d)}</p>
          </div>
        </div>
        <div class="exercise"><h4>✏️ Your turn</h4><span class="stk think">🤔</span>
          ${m.qs.map((x,n)=>`<div class="q">${n+1}. ${esc(x.q)}</div><details><summary>Ver respuesta</summary><div class="ans">✅ ${esc(x.a)}</div></details>`).join("")}</div>
      </div>
      <div class="col">${m.boxes.slice(3).map((b,j)=>box(b,j+3)).join("")}</div>
    </div></section>`;
}

let cur = [], shown = 0;
const STEP = 6;
function paint(){
  document.getElementById("maps").innerHTML = cur.slice(0,shown).map(mapHTML).join("") +
    (shown < cur.length ? `<div style="text-align:center;margin:10px"><button id="more" class="tabs-btn">⬇️ Cargar más (${shown}/${cur.length})</button></div>` : "");
  const more = document.getElementById("more");
  if (more) more.onclick = () => { shown = Math.min(cur.length, shown+STEP); paint(); };
  requestAnimationFrame(draw);
}
function render(){
  const q = query.toLowerCase();
  const fl = curLvl;
  const list = ALL.filter(m => (curCat==="All"||m.cat===curCat) && (!fl||m.lvl===fl) &&
    (!q || (m.t+" "+m.es+" "+m.cat).toLowerCase().includes(q)));
  renderTabs();
  renderSeg();
  document.getElementById("count").textContent = `${list.length} mapas`;
  const ch = document.getElementById("chips");
  ch.innerHTML = list.map((m,k)=>`<a href="#m${m.id}" data-k="${k}">${m.icon} ${m.id+1}. ${esc(m.t)}</a>`).join("");
  ch.querySelectorAll("a").forEach(a=>a.onclick=e=>{
    e.preventDefault(); const k=+a.dataset.k;
    if (k >= shown) { shown = Math.min(cur.length, k+1); paint(); }
    requestAnimationFrame(()=>document.getElementById("m"+list[k].id).scrollIntoView({behavior:"smooth"}));
  });
  cur = list; shown = Math.min(STEP, list.length); paint();
}

// scalloped cloud outline around a superellipse
function cloudPath(w,h){
  const cx=w/2, cy=h/2, rx=w/2+6, ry=h/2+4, n=3.4;
  const pt=t=>{const c=Math.cos(t),s=Math.sin(t);return [cx+rx*Math.sign(c)*Math.pow(Math.abs(c),2/n), cy+ry*Math.sign(s)*Math.pow(Math.abs(s),2/n)];};
  const per=4*(rx+ry)*0.9, N=Math.max(14,Math.round(per/58));
  let d="", prev=pt(0);
  d+=`M${prev[0].toFixed(1)},${prev[1].toFixed(1)}`;
  for(let k=1;k<=N;k++){
    const p=pt(2*Math.PI*k/N), ch=Math.hypot(p[0]-prev[0],p[1]-prev[1]);
    d+=` A${(ch*0.62).toFixed(1)},${(ch*0.62).toFixed(1)} 0 0 1 ${p[0].toFixed(1)},${p[1].toFixed(1)}`;
    prev=p;
  }
  return d+"Z";
}

function draw(){
  const NS="http://www.w3.org/2000/svg";
  document.querySelectorAll(".page").forEach(page=>{
    const id=+page.dataset.id, svg=page.querySelector("svg.arrows");
    const cw=document.getElementById("c"+id), cs=cw.querySelector("svg.cl");
    const cr=cw.getBoundingClientRect();
    cs.setAttribute("viewBox",`0 0 ${cr.width} ${cr.height}`);
    cs.innerHTML=`<path d="${cloudPath(cr.width,cr.height)}" fill="#fff" stroke="#1e3a8a" stroke-width="3.5"/><path d="${cloudPath(cr.width-14,cr.height-14)}" transform="translate(7,7)" fill="none" stroke="#93c5fd" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/>`;
    svg.innerHTML=`<defs>${C.map((c,j)=>`<marker id="ar${id}_${j}" markerWidth="10" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 z" fill="${c}"/></marker>`).join("")}</defs>`;
    const P=page.getBoundingClientRect();
    for(let j=0;j<6;j++){
      const r=document.getElementById(`b${id}_${j}`).getBoundingClientRect(), left=j<3, k=j%3-1;
      const x1=(left?cr.left+8:cr.right-8)-P.left, y1=cr.top+cr.height/2+k*cr.height*0.28-P.top;
      const x2=(left?r.right:r.left)-P.left+(left?4:-4), y2=r.top+r.height*0.28-P.top, mx=(x1+x2)/2;
      const p=document.createElementNS(NS,"path");
      p.setAttribute("d",`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
      p.setAttribute("fill","none"); p.setAttribute("stroke",C[j]); p.setAttribute("stroke-width","3");
      p.setAttribute("stroke-linecap","round"); p.setAttribute("stroke-dasharray","1 7"); p.setAttribute("marker-end",`url(#ar${id}_${j})`);
      svg.appendChild(p);
    }
  });
}

document.getElementById("q").addEventListener("input",e=>{query=e.target.value.trim(); render();});
window.addEventListener("resize",draw);
const upBtn = document.getElementById("up");
window.addEventListener("scroll",()=>upBtn.classList.toggle("show", window.scrollY > 400),{passive:true});
upBtn.addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));
document.getElementById("maps").addEventListener("click",e=>{
  const hd = e.target.closest(".box .hd");
  if (hd && window.matchMedia("(max-width:1000px)").matches) hd.parentElement.classList.toggle("open");
});
document.addEventListener("toggle",draw,true);
render();
</script>
